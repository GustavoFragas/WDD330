<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />

    <script src="/js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="checkout">
        <h2>Review & Place your Order</h2>

        <form id="checkout-form" name="checkout">
          <fieldset>
            <legend>Customer Name</legend>
            <label for="fname">First Name</label>
            <input
              id="fname"
              name="fname"
              type="text"
              autocomplete="given-name"
              required
            />

            <label for="lname">Last Name</label>
            <input
              id="lname"
              name="lname"
              type="text"
              autocomplete="family-name"
              required
            />
          </fieldset>

          <fieldset>
            <legend>Address</legend>
            <label for="street">Street Address</label>
            <input
              id="street"
              name="street"
              type="text"
              autocomplete="street-address"
              required
            />

            <label for="city">City</label>
            <input
              id="city"
              name="city"
              type="text"
              autocomplete="address-level2"
              required
            />

            <label for="state">State</label>
            <input
              id="state"
              name="state"
              type="text"
              autocomplete="address-level1"
              maxlength="2"
              pattern="[A-Za-z]{2}"
              title="Use a two-letter state code."
              required
            />

            <label for="zip">Zip Code</label>
            <input
              id="zip"
              name="zip"
              type="text"
              autocomplete="postal-code"
              inputmode="numeric"
              pattern="[0-9]{5}"
              title="Use a five-digit ZIP code."
              required
            />
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <label for="cardNumber">Credit Card Number</label>
            <input
              id="cardNumber"
              name="cardNumber"
              type="text"
              autocomplete="cc-number"
              inputmode="numeric"
              minlength="16"
              maxlength="16"
              pattern="[0-9]{16}"
              title="Use a 16-digit card number."
              required
            />

            <label for="expiration">Expiration Date</label>
            <input
              id="expiration"
              name="expiration"
              type="text"
              autocomplete="cc-exp"
              placeholder="MM/YY"
              pattern="(0[1-9]|1[0-2])/[0-9]{2}"
              title="Use MM/YY format."
              required
            />

            <label for="code">Security Code</label>
            <input
              id="code"
              name="code"
              type="text"
              autocomplete="cc-csc"
              inputmode="numeric"
              minlength="3"
              maxlength="3"
              pattern="[0-9]{3}"
              title="Use a three-digit security code."
              required
            />
          </fieldset>

          <button type="submit">Checkout</button>
        </form>

        <section id="order-summary" class="order-summary">
          <h3>Order Summary</h3>
          <p>Items (<span id="item-count">0</span>)</p>
          <p>Subtotal: <span id="subtotal">$0.00</span></p>
          <p>Tax: <span id="tax">$0.00</span></p>
          <p>Shipping Estimate: <span id="shipping">$0.00</span></p>
          <p>Order Total: <span id="order-total">$0.00</span></p>
        </section>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
