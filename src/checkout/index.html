<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />

    <script src="/js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="checkout">
        <h2>Review & Place your Order</h2>

        <form id="checkout-form" name="checkout">
          <fieldset>
            <legend>Customer Name</legend>
            <label for="fname">First Name</label>
            <input id="fname" name="fname" type="text" required />

            <label for="lname">Last Name</label>
            <input id="lname" name="lname" type="text" required />
          </fieldset>

          <fieldset>
            <legend>Address</legend>
            <label for="street">Street Address</label>
            <input id="street" name="street" type="text" required />

            <label for="city">City</label>
            <input id="city" name="city" type="text" required />

            <label for="state">State</label>
            <input id="state" name="state" type="text" required />

            <label for="zip">Zip Code</label>
            <input id="zip" name="zip" type="text" required />
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <label for="cardNumber">Credit Card Number</label>
            <input
              id="cardNumber"
              name="cardNumber"
              type="text"
              inputmode="numeric"
              required
            />

            <label for="expiration">Expiration Date</label>
            <input id="expiration" name="expiration" type="text" required />

            <label for="code">Security Code</label>
            <input
              id="code"
              name="code"
              type="text"
              inputmode="numeric"
              required
            />
          </fieldset>

          <button type="submit">Checkout</button>
        </form>

        <section id="order-summary" class="order-summary">
          <h3>Order Summary</h3>
          <p>Items (<span id="item-count">0</span>)</p>
          <p>Subtotal: <span id="subtotal">$0.00</span></p>
          <p>Tax: <span id="tax">$0.00</span></p>
          <p>Shipping Estimate: <span id="shipping">$0.00</span></p>
          <p>Order Total: <span id="order-total">$0.00</span></p>
        </section>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
