<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rick and Morty Explorer</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Rick and Morty Explorer</h1>
    </header>

    <main>
      <form id="search-form" role="search">
        <label for="search-input">Search characters</label>
        <div class="search-controls">
          <input id="search-input" type="search" placeholder="Character name" />
          <button type="submit">Search</button>
        </div>
      </form>

      <h2>Characters</h2>
      <p id="message" role="status">Loading characters...</p>
      <div id="results" class="character-grid"></div>
    </main>

    <footer>
      Data from
      <a href="https://rickandmortyapi.com/">The Rick and Morty API</a>
    </footer>
  </body>
</html>
